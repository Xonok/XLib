# --- NVIDIA NIM: free to prototype, one base endpoint, aggregate-aware pacing ---
#
# The catalogue's /v1/models list is the authority for what this account can reach; an id
# being listed is not proof the account is enabled. Probed 2026-11-06: `kimi-k2.6` and
# `nemotron-nano-3-30b-a3b` answer 404 "Function not found for account", and
# `minimax-m3.1-flash` timed out at 90s, so none of the three is registered yet.
# NIM's stated limit is ~40 requests a minute per model AND it monitors aggregate usage;
# the shared `nim` group is capped at 35 so two waves cannot add up to a 24-hour block.

["nemotron-3-ultra-nim"]
id = "nvidia/nemotron-3-ultra-550b-a55b"
provider = "nim"
transport = "http"
endpoint = "https://integrate.api.nvidia.com/v1"
rpm = 40
aggregate = "nim"
aggregate_rpm = 35
reasoning = true
note = "Third route for the corpus's sharpest cross-route comparison: OpenRouter 3 autonomy of 4, console 0 autonomy of 12. Probed 2026-11-06 in 1.3s."

