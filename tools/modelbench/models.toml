# Model registry — short name → exact provider ID + transport.
#
# Measured, not assumed. Gating on both gateways is undocumented and inconsistent, so
# there is no `gating` column to rot: `python3 transport.py --probe` reports what answers
# right now, and `--limits` reports each pool's allowance. A negative probe is a hint,
# not evidence of unavailability; only a real episode is.
#
# transport = "http"    direct OpenAI-compatible HTTP. ~0 overhead, sub-second.
# transport = "harness" only reachable through `opencode run`. ~13,140 prompt tokens and
#              ~11.5s per call, of which ~13k is opencode's own fixed preamble. It does
#              not shrink when the agent is stripped of tools. ~87x the cost of http.
#
# rpm / tpm     the provider's measured per-minute quota for this model, when known. The
#              transport paces to it. The limit is per model per project, not account-wide,
#              and a per-process pacer cannot coordinate two processes running one model.
# aggregate     a group whose requests share one cross-process minute window. NIM
#              enforces per-model limits AND monitors aggregate usage, and exceeding it
#              can block the account for 24 hours, so NIM entries share the `nim` group.
# aggregate_rpm the group's shared limit, deliberately below the provider's per-model
#              figure: the margin is the mechanism.
# reasoning     true when the model thinks before it answers. The episode runner then gives
#              it the larger per-call budget (12288 rather than 4096): a truncated thinking
#              model returns empty content and grades as a model that cannot follow
#              instructions (E23).

["space-bunny"]
id = "space-bunny-free"
provider = "zen"
transport = "http"
endpoint = "https://opencode.ai/zen/v1"
auth = "none"
note = "Only console free model that answers unauthenticated HTTP; the other 7 return 403. Cloudflare sits in front and rejects urllib's default User-Agent with error 1010, so any client must send its own UA or every call fails while curl-based probes pass."

["big-pickle"]
id = "big-pickle"
provider = "zen"
transport = "harness"
note = "Proposed judge. Reachable only through opencode run, so every judgement costs ~13k tokens of preamble. The argument for a cheaper judge is this cost, not model quality."

