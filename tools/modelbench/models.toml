# Model registry — short name → exact provider ID + transport.
#
# Measured 2026-09-27, not assumed. Gating on both gateways is undocumented and
# inconsistent, so it is recorded per model here and re-verified by
# `python3 bench/transport.py --probe`, never trusted.
#
# gating values, all observed 2026-09-27:
#   open       answers a direct request right now
#   harness    refuses direct requests: "only available on agentic harnesses" (OpenRouter)
#              or "OpenCode's free tier can only be used from within OpenCode" (Zen)
#   upstream   429 from the upstream provider — shared pool exhausted, may recover
#
# transport = "http"    direct OpenAI-compatible HTTP. ~0 overhead, sub-second.
# transport = "harness" only reachable through `opencode run`. ~13,140 prompt tokens and
#              ~11.5s per call, of which ~13k is opencode's own fixed preamble. It does
#              not shrink when the agent is stripped of tools. ~87x the cost of http.

["space-bunny"]
id = "space-bunny-free"
provider = "zen"
transport = "http"
gating = "open"
endpoint = "https://opencode.ai/zen/v1"
auth = "none"
note = "Only console free model that answers unauthenticated HTTP; the other 7 return 403. Cloudflare sits in front and rejects urllib's default User-Agent with error 1010, so any client must send its own UA or every call fails while curl-based probes pass."

["big-pickle"]
id = "big-pickle"
provider = "zen"
transport = "harness"
gating = "harness"
note = "Proposed judge. Reachable only through opencode run, so every judgement costs ~13k tokens of preamble. The argument for a cheaper judge is this cost, not model quality."

["inkling"]
id = "thinkingmachines/inkling:free"
provider = "openrouter"
transport = "harness"
gating = "harness"
endpoint = "https://openrouter.ai/api/v1"
note = "OpenRouter routes this through a step literally named 'Gate Free Endpoints by Agentic Harness' and 403s direct calls. The model at the centre of the tier-list dispute is one of the expensive ones to test."

